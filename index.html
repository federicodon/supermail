<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SuperMail — a keyboard-first email client. Local-first, measurably fast." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235a52e0'/%3E%3Cpath d='M57 14 28 58h17l-7 28 34-46H53l9-26z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>SuperMail — keyboard-first email</title>
    <script>
      // Apply the persisted theme BEFORE first paint (the React effect keeps
      // this blob in sync). Without it a dark-theme user sees a white flash on
      // every load while the bundle streams in. Fail-silent by design.
      (function () {
        try {
          var raw = localStorage.getItem("supermail.theme.v1");
          if (!raw) return;
          var t = JSON.parse(raw);
          var root = document.documentElement;
          if (t && t.vars) {
            for (var k in t.vars) {
              if (/^--[a-z0-9-]+$/i.test(k)) root.style.setProperty(k, String(t.vars[k]));
            }
          }
          if (t.theme) root.setAttribute("data-theme", String(t.theme));
          if (t.group) root.setAttribute("data-theme-group", String(t.group));
          if (t.density) root.setAttribute("data-density", String(t.density));
        } catch (e) {
          /* first paint falls back to the default light theme */
        }
      })();
    </script>
    <script type="module" crossorigin src="/supermail/assets/index-BLITWGQ5.js"></script>
    <link rel="stylesheet" crossorigin href="/supermail/assets/index-BUdFW9rg.css">
