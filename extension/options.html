<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; width: 360px; color: #1a1a23; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d6d6de; border-radius: 7px; font: inherit; }
      .presets { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
      .presets button { border: 1px solid #d6d6de; background: #f5f5f8; border-radius: 14px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
      .hint { color: #71717a; font-size: 12px; margin-top: 10px; }
      .save { margin-top: 12px; background: #5a52e0; color: #fff; border: none; border-radius: 7px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
      #status { color: #0a9e7a; font-size: 12px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>⚡ SuperMail — where does it live?</h1>
    <label for="url">SuperMail URL</label>
    <input id="url" type="url" placeholder="http://localhost:8787/" />
    <div class="presets">
      <button data-url="http://localhost:8787/">Local bridge (real Gmail)</button>
      <button data-url="http://localhost:5273/">Vite dev server</button>
      <button data-url="https://federicodon.github.io/supermail/">GitHub Pages (demo)</button>
    </div>
    <button class="save" id="save">Save</button><span id="status"></span>
    <p class="hint">
      For <strong>real two-way Gmail sync</strong> run the local bridge
      (<code>npm run build</code> once, then keep <code>npm run sync</code> running — or the
      LaunchAgent) and use <code>http://localhost:8787/</code>. The GitHub Pages URL serves the
      static demo with a mock mailbox.
    </p>
    <script src="options.js"></script>
  </body>
</html>
